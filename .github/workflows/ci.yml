name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

# A new push to the same branch cancels the previous run. Without this, a busy
# branch queues up runs that are already obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  lint-and-typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install
        run: npm ci

      # Prisma generates the typed client from schema.prisma. Without it every
      # `import { Role } from "@prisma/client"` is a type error, so this has to
      # run before any tsc invocation. It needs no database connection.
      - name: Generate Prisma client
        run: npm run db:generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/analytics_admin?schema=public
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/analytics_admin?schema=public

      - name: Typecheck
        run: npm run typecheck

  test-backend:
    name: Backend tests
    runs-on: ubuntu-latest

    # Real Postgres and real Redis. The previous workflow started neither, which
    # is why the repository had no database-backed tests: they were impossible
    # to run in CI, so nobody wrote them.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: analytics_admin_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        # Without a health check the job races the database and fails
        # intermittently on a cold runner.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/analytics_admin_test?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/analytics_admin_test?schema=public
      REDIS_URL: redis://localhost:6379
      FRONTEND_URL: http://localhost:5173
      API_BASE_URL: http://localhost:4000
      JWT_ACCESS_SECRET: test-access-secret
      JWT_REFRESH_SECRET: test-refresh-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      # migrate deploy, not migrate dev: it applies committed migrations without
      # ever prompting or generating new ones. `migrate dev` in CI can rewrite
      # migration history, which is not something a build should be able to do.
      - name: Apply migrations
        run: npm run db:migrate:deploy

      - name: Test
        run: npm run test -w backend

  test-frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install
        run: npm ci

      # The frontend imports no Prisma types, but the workspace-wide typecheck
      # in its `test` path can, so generate the client to be safe.
      - name: Generate Prisma client
        run: npm run db:generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/analytics_admin?schema=public
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/analytics_admin?schema=public

      - name: Test
        run: npm run test -w frontend

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/analytics_admin?schema=public
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/analytics_admin?schema=public

      - name: Build
        run: npm run build

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    needs: [build]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: analytics_admin
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/analytics_admin?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/analytics_admin?schema=public
      REDIS_URL: redis://localhost:6379
      FRONTEND_URL: http://localhost:5173
      API_BASE_URL: http://localhost:4000
      VITE_API_URL: http://localhost:4000
      JWT_ACCESS_SECRET: test-access-secret
      JWT_REFRESH_SECRET: test-refresh-secret
      BACKEND_PORT: "4000"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Apply migrations
        run: npm run db:migrate:deploy

      - name: Seed
        run: npm run db:seed

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      # playwright.config.ts owns starting the servers via its webServer block,
      # so the run is self-contained and behaves the same locally.
      - name: Run Playwright
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
